name: Checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run db:local && npm run seed:local
      - run: npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait --wait-timeout 90
      - run: node scripts/verify/smoke.mjs http://127.0.0.1:8787
      - if: always()
        run: docker compose logs --tail 50 app
      - if: always()
        run: docker compose down
