name: muni-training-evidence
services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - local-d1:/app/.wrangler
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(async r=>{const h=await r.json();process.exit(r.ok&&h.status==='ok'&&h.employees===174?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6
volumes:
  local-d1:
